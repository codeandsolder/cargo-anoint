name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked
      - run: cargo clippy --locked -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo test --locked
      - name: Install smoke test
        if: matrix.toolchain == 'stable'
        run: |
          cargo install --path . --debug --locked
          cargo anoint --help
          cargo anoint --offline --no-audit-code
          cargo anoint --feedback >/tmp/feedback-smoke.txt
          wc -l /tmp/feedback-smoke.txt
      - name: Run security audit
        if: matrix.toolchain == 'stable'
        run: |
          cargo install cargo-audit --locked
          cargo audit
