name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@f79aef2a560a2c1c0f06f3c657f690f778040156
    with:
      rust-components: clippy rustfmt
      test-impact-mode: none
      command: |
        cargo fmt --all -- --check
        cargo clippy --locked --all-targets -- -D warnings
        cargo test --locked
        cargo install --path . --debug --locked
        cargo anoint --help
        cargo anoint --workspace --offline --fail-on-overlap
        cargo anoint --feedback
        cargo install cargo-audit --version 0.23.0 --locked
        cargo audit
  quarantine:
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@f79aef2a560a2c1c0f06f3c657f690f778040156
