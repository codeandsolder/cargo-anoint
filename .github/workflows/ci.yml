name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      rust-toolchain: nightly-2026-11-23
      cargo-args: "--locked --workspace --all-targets"
      apt-packages: "clang libclang-dev cmake"
      allow-test-panics: true
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@f79aef2a560a2c1c0f06f3c657f690f778040156 # main
    with:
      test-impact-mode: none
      command: |
        cargo test --locked
        cargo install --path . --debug --locked
        cargo anoint --help
        cargo anoint --workspace --offline --fail-on-overlap
        cargo anoint --feedback
        cargo install cargo-audit --version 0.23.0 --locked
        cargo audit
