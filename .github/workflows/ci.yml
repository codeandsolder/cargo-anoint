name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@4f29271a2aa27bef1f34bd70407b0db3d39904a9 # main
    with:
      rust-toolchain: nightly-2026-11-23
      cargo-args: "--locked --workspace --all-targets"
      apt-packages: "clang libclang-dev cmake"
      allow-test-panics: true
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      test-impact-mode: none
      command: |
        cargo test --locked
        cargo install --path . --debug --locked
        cargo anoint --help
        cargo anoint --workspace --offline --fail-on-overlap
        cargo anoint --feedback
        cargo install cargo-audit --version 0.23.0 --locked
        cargo audit

  merge-gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [strict-rust, check]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["strict-rust", "success"], ["check", "success"]]
