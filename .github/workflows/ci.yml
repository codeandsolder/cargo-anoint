name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      rust-toolchain: nightly-2026-11-23
      apt-packages: clang libclang-dev cmake
      strict-suites: |
        [{"name":"native","cargo":["--locked","--workspace","--all-targets"],"allow-test-panics":true}]
      test-suites: |
        [{"name":"native","cargo":["--locked","--workspace"],"doctests":["--locked","--workspace"]}]
      command: |
        cargo install --path . --debug --locked
        cargo anoint --help
        cargo anoint --workspace --offline --fail-on-overlap
        cargo anoint --feedback
        cargo install cargo-audit --version 0.23.0 --locked
        cargo audit

  merge-gate:
    name: CI merge gate
    if: ${{ always() }}
    needs: [check]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["check", "success"]]
