[package]
name = "cargo-anoint"
publish = false
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
default-run = "cargo-anoint"
description = "Modernize your Rust dependencies with blessed.rs + live intel"
license = "MIT"
repository = "https://github.com/codeandsolder/cargo-anoint"
readme = "README.md"
keywords = ["cargo", "dependencies", "modernize", "blessed", "lint"]
categories = ["development-tools::cargo-plugins"]
exclude = [
    "plan.md",
    "tipsforai.md",
    ".github/",
    ".coderabbit.yaml",
    ".agents/",
    "bullshitdetector/",
    "docs/phase3-workspace-design.md",
]

[[bin]]
name = "cargo-anoint"
path = "src/main.rs"

[[bin]]
name = "update-suggestions"
path = "src/bin/update_suggestions.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Cargo parsing
cargo_metadata = "0.19"

# TOML editing (comment-preserving)
toml_edit = { version = "0.22", features = ["serde"] }

# HTTP client
wreq = { git = "https://github.com/codeandsolder/wreq-exp", rev = "aad8f97d78e40c4c9fc0ddbb0cf88af870f848ac", default-features = false, features = ["webpki-roots", "tokio-rt", "http2", "json"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

# Terminal output
colored = "2"

# XDG-compliant cache paths
directories = "6.0"

# Error handling
anyhow = "1"

[dev-dependencies]
tempfile = "=3.23.0"
assert_cmd = "=2.1.2"
predicates = "=3.1.4"
